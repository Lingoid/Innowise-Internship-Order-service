databaseChangeLog:
  - changeSet:
      id: 2-create-table-items
      author: Lingoid
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal(10,2)
                  constraints:
                    nullable: false

        - createIndex:
            tableName: items
            indexName: idx_items_name
            columns:
              - column:
                  name: name

        - createIndex:
            tableName: items
            indexName: idx_items_price
            columns:
              - column:
                  name: price