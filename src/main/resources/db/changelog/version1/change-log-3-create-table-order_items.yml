databaseChangeLog:
  - changeSet:
      id: 3-create-table-order-items
      author: Lingoid
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    foreignKeyName: order_items_order_fk
                    referencedTableName: orders
                    referencedColumnNames: id
                    nullable: false
              - column:
                  name: item_id
                  type: bigint
                  constraints:
                    foreignKeyName: order_items_item_fk
                    referencedTableName: items
                    referencedColumnNames: id
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false

        - createIndex:
            tableName: order_items
            indexName: idx_order_items_order_id
            columns:
              - column:
                  name: order_id
        - createIndex:
            tableName: order_items
            indexName: idx_order_items_item_id
            columns:
              - column:
                  name: item_id